
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLE BOOM — Премиальный интернет-магазин техники</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F3F1EB;
            --bg-card: #EAE7DF;
            --sage: #929B89;
            --sage-light: #D5D8CD;
            --graphite: #41483F;
            --white: #FFFFFF;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--graphite);
            line-height: 1.6;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            background: rgba(243, 241, 235, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(65, 72, 63, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--graphite);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--graphite);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--sage);
        }

        .badge-count {
            background: var(--sage);
            color: var(--white);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
        }

        /* HERO SECTION */
        .hero {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .hero-banner {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 80px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content h1 {
            font-size: 56px;
            line-height: 1.1;
            margin-bottom: 20px;
            color: var(--graphite);
        }

        .hero-content p {
            font-size: 16px;
            color: rgba(65, 72, 63, 0.8);
            margin-bottom: 30px;
            max-width: 450px;
        }

        .btn {
            display: inline-block;
            background: var(--graphite);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--sage);
        }

        /* CONTROLS & SEARCH */
        .controls-section {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 30px;
            border: 1px solid rgba(65, 72, 63, 0.15);
            background: var(--bg-card);
            font-size: 14px;
            outline: none;
            color: var(--graphite);
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--sage);
        }

        .search-bar svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: rgba(65, 72, 63, 0.5);
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: var(--bg-card);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--graphite);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--sage);
            color: var(--white);
        }

        /* CATALOG GRID */
        .catalog {
            max-width: 1400px;
            margin: 0 auto 80px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(65, 72, 63, 0.05);
        }

        .product-img-container {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: var(--transition);
        }

        .product-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product-info p {
            font-size: 13px;
            color: rgba(65, 72, 63, 0.7);
            margin-bottom: 15px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .price {
            font-weight: 600;
            font-size: 16px;
        }

        /* MODAL WINDOWS / CART */
        .modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: var(--bg-main);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            z-index: 2000;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .modal.open {
            right: 0;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--graphite);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-actions {
            margin-top: 20px;
            border-top: 1px solid rgba(65, 72, 63, 0.1);
            padding-top: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .hero-banner {
                grid-template-columns: 1fr;
                padding: 40px 20px;
            }
            .hero-content h1 {
                font-size: 36px;
            }
            .nav-container {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">APPLE BOOM</a>
            <ul class="nav-links">
                <li><a onclick="filterCategory('all')">Каталог</a></li>
                <li><a onclick="openCart()">Корзина <span id="cart-count" class="badge-count">0</span></a></li>
            </ul>
        </div>
    </header>

    <section class="hero">
        <div class="hero-banner">
            <div class="hero-content">
                <h1>Новая философия технологий.</h1>
                <p>Премиальная техника Apple, Samsung, Google Pixel и PlayStation в эстетике Sage Minimal.</p>
                <button class="btn" onclick="scrollToCatalog()">Перейти в каталог</button>
            </div>
            <div style="text-align: center;">
                <img src="apple boom/B48B2E5C-1574-4A93-A6CE-E81BA100A2D1.JPEG" alt="Device" style="max-width: 100%; border-radius: 16px; max-height: 320px; object-fit: contain;">
            </div>
        </div>
    </section>

    <div class="controls-section" id="catalog-section">
        <div class="search-bar">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Поиск по названию, модели, цвету..." oninput="handleSearch()">
        </div>
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('all')">Все</button>
            <button class="cat-btn" onclick="filterCategory('iPhone')">iPhone</button>
            <button class="cat-btn" onclick="filterCategory('MacBook')">MacBook</button>
            <button class="cat-btn" onclick="filterCategory('iPad')">iPad</button>
            <button class="cat-btn" onclick="filterCategory('Watch')">Apple Watch</button>
            <button class="cat-btn" onclick="filterCategory('PlayStation')">PlayStation</button>
            <button class="cat-btn" onclick="filterCategory('Samsung')">Samsung</button>
            <button class="cat-btn" onclick="filterCategory('Pixel')">Google Pixel</button>
        </div>
    </div>

    <main class="catalog" id="productCatalog">
        <!-- Товары рендерятся динамически -->
    </main>

    <!-- Корзина -->
    <div class="overlay" id="overlay" onclick="closeModals()"></div>
    <div class="modal" id="cartModal">
        <div class="modal-header">
            <h2 class="serif">Корзина</h2>
            <button class="close-btn" onclick="closeModals()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-actions">
            <p id="cartTotal" style="font-weight: 600; margin-bottom: 15px;">Цена по запросу</p>
            <button class="btn" style="width: 100%; text-align: center;" onclick="checkoutTelegram()">Оформить в Telegram</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "iPhone 17 Pro", category: "iPhone", color: "Silver", price: "Цена по запросу", img: "apple boom/B48B2E5C-1574-4A93-A6CE-E81BA100A2D1.JPEG", desc: "Флагманский смартфон с титановым корпусом." },
            { id: 2, name: "MacBook Air 15″", category: "MacBook", color: "Sky Blue", price: "Цена по запросу", img: "apple boom/34DA499D-CFCE-44EF-A40E-20BE58D44897.JPEG", desc: "Тонкий и производительный ноутбук." },
            { id: 3, name: "iPad Pro 13″", category: "iPad", color: "Space Black", price: "Цена по запросу", img: "apple boom/3E72674B-2113-4EA2-8C06-C7340D7AEDAE.JPEG", desc: "Планшет с безупречным OLED-дисплеем." },
            { id: 4, name: "Samsung Galaxy S26 Ultra", category: "Samsung", color: "Cobalt Violet", price: "Цена по запросу", img: "apple boom/BA286FDE-222C-4B1A-AD86-A7798C6D9F79.JPEG", desc: "Максимальная производительность и инновации." },
            { id: 5, name: "PlayStation 5 Pro", category: "PlayStation", color: "White", price: "Цена по запросу", img: "apple boom/FC145BCE-B651-4BBB-BD77-8473A8DFF404.JPEG", desc: "Мощная игровая консоль нового поколения." },
            { id: 6, name: "Google Pixel 11 Pro XL", category: "Pixel", color: "Obsidian", price: "Цена по запросу", img: "apple boom/3B4B99D1-C170-4FE7-8378-B89119AC90D5.JPEG", desc: "Интеллектуальный смартфон с передовой камерой." }
        ];

        let cart = JSON.parse(localStorage.getItem('apple_boom_cart')) || [];

        function renderCatalog(items) {
            const container = document.getElementById('productCatalog');
            container.innerHTML = '';
            if(items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: rgba(65,72,63,0.6);">Ничего не найдено</p>';
                return;
            }
            items.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <img src="${product.img}" alt="${product.name}" class="product-img">
                        </div>
                        <div class="product-info">
                            <p>${product.category} • ${product.color}</p>
                            <h3>${product.name}</h3>
                            <p style="font-size: 12px; margin-top: 5px;">${product.desc}</p>
                        </div>
                        <div class="product-footer">
                            <span class="price">${product.price}</span>
                            <button class="btn" onclick="addToCart(${product.id})">Заказать</button>
                        </div>
                    </div>
                `;
            });
            updateCounters();
        }

        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if(category === 'all') {
                renderCatalog(products);
            } else {
                renderCatalog(products.filter(p => p.category.toLowerCase() === category.toLowerCase()));
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderCatalog(products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query) || p.color.toLowerCase().includes(query)));
        }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            localStorage.setItem('apple_boom_cart', JSON.stringify(cart));
            updateCounters();
            openCart();
        }

        function updateCounters() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCart() {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = '<p style="color: rgba(65,72,63,0.6);">Корзина пуста</p>';
            } else {
                cart.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <h4 style="font-size: 15px;">${item.name}</h4>
                                <p style="font-size: 12px;">${item.color}</p>
                            </div>
                            <button onclick="removeFromCart(${index})" style="background:none;border:none;cursor:pointer;color:#c0392b;">Удалить</button>
                        </div>
                    `;
                });
            }
            document.getElementById('cartModal').classList.add('open');
            document.getElementById('overlay').classList.add('active');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('apple_boom_cart', JSON.stringify(cart));
            openCart();
            updateCounters();
        }

        function closeModals() {
            document.getElementById('cartModal').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        function checkoutTelegram() {
            if(cart.length === 0) { alert('Ваша корзина пуста'); return; }
            let message = "Здравствуйте! Хочу оформить заказ в Apple Boom:%0A%0A";
            cart.forEach((item, idx) => { message += `${idx + 1}. ${item.name} (${item.color}) - ${item.price}%0A`; });
            window.open(`https://t.me/Wagapapa21?text=${message}`, '_blank');
        }

        function scrollToCatalog() {
            document.getElementById('catalog-section').scrollIntoView({ behavior: 'smooth' });
        }

        renderCatalog(products);
    </script>
</body>
</html>
